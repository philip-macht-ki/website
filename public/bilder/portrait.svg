<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <rect width="640" height="640" fill="#ece5d8" />
  <rect x="14" y="14" width="612" height="612" fill="none" stroke="#1d1b19" stroke-opacity="0.18" stroke-width="2" />

  <!-- Blatt Papier mit angedeuteten Skizzenlinien -->
  <g transform="rotate(-6 320 300)">
    <rect x="195" y="150" width="250" height="310" rx="4" fill="#f6f3ee" stroke="#1d1b19" stroke-opacity="0.15" stroke-width="2" />
    <line x1="225" y1="205" x2="410" y2="205" stroke="#1d1b19" stroke-opacity="0.35" stroke-width="4" />
    <line x1="225" y1="235" x2="385" y2="235" stroke="#1d1b19" stroke-opacity="0.35" stroke-width="4" />
    <line x1="225" y1="265" x2="400" y2="265" stroke="#1d1b19" stroke-opacity="0.35" stroke-width="4" />
  </g>

  <!-- Stift, diagonal über das Blatt gelegt -->
  <g transform="rotate(40 420 430)">
    <rect x="382" y="160" width="22" height="290" rx="11" fill="#1d1b19" />
    <rect x="382" y="160" width="22" height="44" rx="11" fill="#b4532a" />
  </g>

  <!-- Farbfeld -->
  <circle cx="468" cy="486" r="24" fill="#b4532a" />
</svg>
